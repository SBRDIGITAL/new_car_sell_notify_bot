# docker-compose для запуска бота уведомлений о продаже автомобилей
# Бот работает в контейнере и взаимодействует с внешним API уведомлений

version: '3.8'

services:
  new_car_sell_notify_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new_car_sell_notify_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Переопределяем хост API для Docker окружения
      # Если API запущен на хосте, используем host.docker.internal
      - NOTIFY_API_HOST=${NOTIFY_API_HOST:-host.docker.internal}
      - NOTIFY_API_PORT=${NOTIFY_API_PORT:-8000}
      - ENV=production
    networks:
      - new_car_sell_notify_net
    # depends_on указываем только если API тоже в docker-compose
    depends_on:
      - new_car_sell_notify_service_api

networks:
  new_car_sell_notify_net:
    name: new_car_sell_notify_net
    driver: bridge
