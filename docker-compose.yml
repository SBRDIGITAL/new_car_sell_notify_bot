# docker-compose для запуска бота уведомлений о продаже автомобилей
# Бот работает в контейнере и взаимодействует с внешним API уведомлений

services:
  new_car_sell_notify_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new_car_sell_notify_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Переопределяем хост API для Docker окружения
      # В Docker используем имя сервиса из другого docker-compose
      - NOTIFY_API_HOST=new_car_sell_notify_service_api
      - NOTIFY_API_PORT=${NOTIFY_API_PORT:-8000}
      - ENV=production
    networks:
      - new_car_sell_notify_net
    # depends_on НЕ используется, так как API в отдельном docker-compose

networks:
  new_car_sell_notify_net:
    external: true  # Подключаемся к существующей сети API
    name: new_car_sell_notify_net
